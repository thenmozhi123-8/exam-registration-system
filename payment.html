
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        .details {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #4f46e5;
        }

        .status {
            text-align: center;
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            background: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Payment Details</h1>
        <p style="text-align:center;">Examination Fee Details</p>

        <div class="details">

            <div class="row">
                <span>Student Name</span>
                <span>Thenmozhi</span>
            </div>

            <div class="row">
                <span>Register Number</span>
                <span>12345</span>
            </div>

            <div class="row">
                <span>Semester</span>
                <span>Semester 5</span>
            </div>

            <div class="row">
                <span>Exam Fee</span>
                <span>₹1,000</span>
            </div>

            <div class="row">
                <span>Late Fee</span>
                <span>₹0</span>
            </div>

            <div class="row total">
                <span>Total Amount</span>
                <span>₹1,000</span>
            </div>

        </div>

        <div class="status">
            Payment Status: Pending
        </div>

        <button onclick="alert('Demo only: No real payment was made.')">
            Pay Now
        </button>

        <button class="back" onclick="location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

</body>
</html>
